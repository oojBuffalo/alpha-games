[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-games"
version = "0.0.0"
description = "AlphaZero replication as a game-agnostic engine; POC game Blokus Duo."
requires-python = ">=3.11"
# NumPy/torch arrive at M2 with encoding/training; adapters (games/) stay stdlib-pure. In
# installed package code, torch is confined to core/network.py, core/losses.py, core/train.py,
# core/checkpoint.py (M3, the checkpoint bundle's state dicts); NumPy also lands in
# core/replay_shard.py (M3, the on-disk shard array layout). dev-only scripts/ (e.g. the M2
# GPU benchmark) may also import torch.
dependencies = ["numpy>=1.26", "torch>=2.3"]  # 2.3: torch.amp.GradScaler (core/train.py)

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
# Engine + adapters only; excludes metadocs/ and tests/ from the installed package
# (tests still run from source via pytest's pythonpath setting below).
include = ["core*", "games*"]

[tool.pytest.ini_options]
# Run from the repo root; core/ and games/ are importable as top-level packages
# without an editable install.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: high-sim search / heavy training tests; deselect with '-m \"not slow\"'.",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
